parameters:
  - $ref: '../params/order_uuid.yaml'
  
post:
  summary: Pay for an order
  description: Initiate payment for a specific order.
  operationId: payOrder
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/pay_order_request.yaml'
  responses:
    '200':
      description: Successful response with the payment details.
      content:
        application/json:
          schema:
            $ref: '../components/pay_order_response.yaml'
    '404':
      description: Order not found.
      content:
        application/json:
          schema:
            $ref: '../components/errors/not_found_error.yaml'
    '500':
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '../components/errors/internal_server_error.yaml'
    '400':
      description: Bad request due to invalid order ID.
      content:
        application/json:
          schema:
            $ref: '../components/errors/bad_request_error.yaml'
    default:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: '../components/errors/generic_error.yaml'