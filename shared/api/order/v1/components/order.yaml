type: object
required:
  - id
  - userId
  - items
  - totalAmount
  - transactionId
  - status
  - payment
properties:
  id:
    type: string
    description: Unique identifier for the order.
  userId:
    type: string
    description: Identifier of the user who placed the order.
  items:
    type: array
    description: List of items in the order.
    items:
      type: object
      properties:
        productId:
          type: string
          description: Identifier of the product.
  totalAmount:
    type: number
    format: float
    description: Total amount for the order.
  transactionId:
    type: string
    description: Identifier of the payment transaction.
  status:
    type: string
    description: Current status of the order (e.g., pending, completed, canceled).