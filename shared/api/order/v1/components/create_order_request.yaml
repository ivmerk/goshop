type: object
description: The user is taken from the session (X-Session-Uuid header), not from the body.
required:
  - part_uuids
properties:
  part_uuids:
    type: array
    description: List of item UUIDs in the order.
    items:
      type: string
      format: uuid
      example: "123e4567-e89b-12d3-a456-426614174000"