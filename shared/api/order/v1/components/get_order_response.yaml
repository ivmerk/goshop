type: object
required:
  - order_uuid
  - user_uuid
  - part_uuids
  - total_price
  - status
properties:
  order_uuid:
    type: string
    format: uuid
    description: Unique identifier for the order.
    example: "123e4567-e89b-12d3-a456-426614174000"
  user_uuid:
    type: string
    format: uuid
    description: UUID of the user who placed the order.
    example: "123e4567-e89b-12d3-a456-426614174000"
  part_uuids:
    type: array
    format: uuid
    description: List of UUIDs for the parts in the order.
    items:
      type: string
      format: uuid
      example: "123e4567-e89b-12d3-a456-426614174000"
  total_price:
    type: number
    format: double
    description: Total price for the order.
    example: 100.00
  transaction_uuid:
    type: string
    format: uuid
    description: Unique identifier for the payment transaction.
    example: "123e4567-e89b-12d3-a456-426614174000"
  payment_method:
    $ref: './enums/payment_method.yaml'
  status:
    $ref: './enums/order_status.yaml'