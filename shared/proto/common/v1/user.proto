syntax = "proto3";

package common.v1;

option go_package = "github.com/ivmerk/goshop/shared/pkg/proto/common/v1;common_v1";

enum ProviderName {
  PROVIDER_NAME_UNSPECIFIED = 0;
  TELEGRAM = 1;
  EMAIL = 2;
  PUSH = 3;
}

message NotificationMethod {
  ProviderName provider_name = 1;
  string target = 2;
}

message UserInfo {
  string user_uuid = 1;
  string login = 2;
  string email = 3;
}

