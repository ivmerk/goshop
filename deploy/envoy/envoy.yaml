# Единая точка входа (API-шлюз) goshop.
#
#   клиент ──► Envoy :8000 ─┬─ /order/*      → order_service     (HTTP → HTTP)
#                           ├─ /inventory/*  → inventory_service (HTTP/JSON → gRPC, см. ниже)
#                           └─ /healthz      → ответ самого Envoy
#
# Фильтры: grpc_json_transcoder (JSON ↔ gRPC для Inventory). Фильтр ext_authz
# (проверка сессии через IAM) добавляется в следующем коммите.
# Админка Envoy: http://localhost:8001 (stats, clusters, config_dump).

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 8001 }

static_resources:
  listeners:
    - name: ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 8000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                codec_type: AUTO
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          time: "%START_TIME%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          status: "%RESPONSE_CODE%"
                          flags: "%RESPONSE_FLAGS%"
                          upstream: "%UPSTREAM_CLUSTER%"
                          duration_ms: "%DURATION%"
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: goshop
                      domains: ["*"]
                      routes:
                        # Технический путь: отвечает сам Envoy, до сервисов не доходит
                        - match: { path: "/healthz" }
                          direct_response:
                            status: 200
                            body: { inline_string: "ok" }

                        # Order — обычный HTTP-сервис: срезаем префикс /order,
                        # /order/api/v1/orders уходит в Order как /api/v1/orders
                        - match: { prefix: "/order/" }
                          route:
                            cluster: order_service
                            prefix_rewrite: "/"
                            timeout: 15s

                        # Inventory — gRPC-сервис. Клиент ходит на /inventory/v1/..., но транскодер
                        # переписывает запрос в gRPC-вызов (POST /inventory.v1.InventoryService/<Метод>)
                        # и Envoy выбирает маршрут заново уже по этому пути, поэтому матчим его.
                        # Неизвестные REST-пути под /inventory транскодер не пропустит: будет 404.
                        - match: { prefix: "/inventory.v1.InventoryService/" }
                          route:
                            cluster: inventory_service
                            timeout: 15s
                          # Inventory читает сессию из gRPC-метаданных с ключом session-uuid,
                          # а клиент присылает HTTP-заголовок X-Session-Uuid. Копируем значение
                          # (OVERWRITE: подделать session-uuid отдельным заголовком нельзя).
                          request_headers_to_add:
                            - header: { key: session-uuid, value: "%REQ(X-SESSION-UUID)%" }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                http_filters:
                  # JSON ↔ gRPC. Работает только для методов из дескриптора
                  # (inventory.v1.InventoryService), остальные запросы (/order, /healthz)
                  # проходят мимо без изменений.
                  - name: envoy.filters.http.grpc_json_transcoder
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                      proto_descriptor: /etc/envoy/inventory.pb
                      services: ["inventory.v1.InventoryService"]
                      # Явные маршруты берём из google.api.http, угадывать по имени метода не нужно
                      auto_mapping: false
                      print_options:
                        add_whitespace: false
                        always_print_primitive_fields: true
                        always_print_enums_as_ints: false
                        preserve_proto_field_names: false
                      # gRPC-ошибка → HTTP-код (Unauthenticated → 401, NotFound → 404 ...) и JSON-тело
                      convert_grpc_status: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: order_service
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: order_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: order, port_value: 8080 }

    - name: inventory_service
      type: STRICT_DNS
      connect_timeout: 2s
      # gRPC работает поверх HTTP/2, без этого Envoy будет говорить с Inventory по HTTP/1.1
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: inventory_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: inventory, port_value: 50051 }
