input {
  gelf {
    port => 12201
    type => "docker"
  }
}

filter {
  # Имя сервиса = имя контейнера (iam, order, ...)
  mutate {
    add_field => { "service" => "%{container_name}" }
    # GELF кладёт числовой syslog-уровень в level; освобождаем имя под строковый уровень zap
    rename => { "level" => "syslog_level" }
  }

  # Сервисы пишут JSON (zap): разбираем строку в поля
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "log"
      skip_on_invalid_json => true
    }
    if [log][timestamp] {
      date {
        match => ["[log][timestamp]", "ISO8601"]
        target => "@timestamp"
      }
    }
    if [log][message] {
      mutate { replace => { "message" => "%{[log][message]}" } }
    }
    if [log][level] {
      mutate { add_field => { "level" => "%{[log][level]}" } }
    }
  } else {
    # Не-JSON строки (например, goose при миграциях)
    mutate { add_tag => ["unstructured"] }
  }

  mutate {
    remove_field => ["host", "command", "created", "image_id", "image_name", "container_id", "tag", "version", "source_host", "type"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "svc-logs-%{service}-%{+YYYY.MM.dd}"
  }
}
